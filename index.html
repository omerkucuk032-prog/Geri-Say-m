<!DOCTYPE html>

<html lang="tr">
<head>

<link rel="manifest" href="./manifest.json">

<title>Geri Sayım</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#193541">

<style>

:root{--ink:#19303b;--muted:#667781;--paper:#f4f0e7;--card:#fffcf6;--line:#d8d0c3;--coral:#d86d4a;--teal:#39858d;--navy:#193541;--soft:#e6dfd3;--danger:#ad3931}

*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:radial-gradient(circle at 80% 5%,#d86d4a1b,transparent 25rem),var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

button,input,textarea,select{font:inherit}button,a{color:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{position:fixed;inset:0 auto 0 0;width:258px;padding:28px 18px;background:var(--navy);color:#efeada;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin:0 10px 55px;font-weight:700}.mark{height:36px;width:36px;border:1px solid #efeada80;border-radius:50%;display:grid;place-items:center;position:relative}.mark:before,.mark:after{content:"";position:absolute;width:2px;border-radius:2px;transform-origin:bottom;background:var(--coral)}.mark:before{height:11px;transform:rotate(38deg)}.mark:after{height:8px;background:#efeada;transform:rotate(164deg)}.brand-name{letter-spacing:-.04em}.brand-name span{color:var(--coral)}.nav-label,.eyebrow{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase}.nav-label{color:#efeada70;margin:0 12px 11px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;color:#efeadaaa;border-radius:10px;min-height:47px;padding:0 12px;display:flex;align-items:center;gap:11px;transition:.2s}.nav button:hover,.nav button.active{background:#efeada18;color:#efeada}.nav button.active{box-shadow:inset 3px 0 var(--coral)}.side-note{margin-top:auto;border-top:1px solid #efeada25;padding:18px 11px 3px;color:#efeada7a;font-size:12px;line-height:1.55}.side-note strong{display:block;color:#efeadaD0;margin-bottom:4px}.main{margin-left:258px;flex:1;min-width:0}.mobile{display:none}.wrap{width:min(1150px,calc(100% - 82px));margin:auto;padding:55px 0 80px}.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:42px}.eyebrow{color:var(--teal)}h1{font-size:clamp(35px,4.2vw,58px);line-height:.99;letter-spacing:-.065em;font-weight:600;margin:10px 0 0}h2{letter-spacing:-.04em}.subtitle{color:var(--muted);font-size:15px;line-height:1.5;max-width:530px;margin:15px 0 0}.primary,.secondary,.quiet,.danger{border:0;border-radius:9px;min-height:44px;padding:0 17px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:600;text-decoration:none;transition:.2s}.primary{background:var(--coral);color:#fff9ef;box-shadow:0 8px 17px #d86d4a30}.primary:hover{transform:translateY(-2px);box-shadow:0 11px 21px #d86d4a40}.secondary{border:1px solid var(--line);background:var(--card)}.secondary:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}.quiet{background:transparent;color:var(--muted);padding:0 10px;min-height:36px}.quiet:hover{background:var(--soft);color:var(--ink)}.danger{background:transparent;color:var(--danger);padding:0 10px;min-height:36px}.danger:hover{background:#ad393116}.hero-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr);gap:22px}.hero{min-height:363px;padding:38px;border-radius:18px;background:var(--navy);color:#efeada;position:relative;overflow:hidden;box-shadow:0 18px 45px #27363814}.hero:before,.hero:after{content:"";position:absolute;border:1px solid #efeada16;border-radius:50%;right:-75px;top:-74px;width:295px;height:295px}.hero:after{width:190px;height:190px;right:-22px;top:-22px}.hero .eyebrow{color:var(--coral)}.hero h2{font-size:clamp(36px,5vw,67px);line-height:.96;max-width:540px;margin:19px 0 22px;position:relative;z-index:1}.hero p{max-width:420px;color:#efeadaa3;line-height:1.55;font-size:14px;position:relative;z-index:1}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:31px;position:relative;z-index:1}.clock{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:363px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px #2736380f}.clock-top{display:flex;justify-content:space-between}.clock-reading{font:500 clamp(34px,4vw,61px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.1em;margin:27px 0 9px;white-space:nowrap}.clock-seconds,.clock-ms{color:var(--coral)}.clock-ms{font-size:.45em;letter-spacing:-.08em}.clock-date{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.rule{height:1px;background:var(--line);margin:25px 0 18px}.clock-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;margin-right:6px;box-shadow:0 0 0 4px #39858d21}.section-head{display:flex;justify-content:space-between;align-items:center;margin:52px 0 16px}.section-head h2{font-size:17px;margin:0}.section-head button{border:0;background:transparent;color:var(--teal);font-weight:600}.mini-list{display:grid;gap:9px}.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 18px;display:flex;justify-content:space-between;gap:20px}.mini-title{font-size:14px;font-weight:600}.meta{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:5px}.mini-time,.remaining{color:var(--teal);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.empty-mini,.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);font-size:13px}.form-wrap{max-width:840px}.form-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,40px);box-shadow:0 8px 24px #2736380f}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field{display:grid;gap:8px}.field.full{grid-column:1/-1}.label{font-size:13px;font-weight:600}.hint{font-size:11px;color:var(--muted);line-height:1.4}.input,.textarea,.file{width:100%;border:1px solid #c8bfae;border-radius:9px;background:var(--paper);color:var(--ink);padding:12px 13px}.input:focus,.textarea:focus,.file:focus{outline:3px solid #d86d4a30;border-color:var(--coral)}.textarea{min-height:114px;resize:vertical}.file{padding:9px;font-size:12px}.file::file-selector-button{border:0;border-radius:6px;background:var(--soft);padding:8px 11px;margin-right:10px;cursor:pointer;font-weight:600;font-size:11px}.error{color:var(--danger);font-size:12px;margin-top:17px}.form-actions{border-top:1px solid var(--line);margin-top:30px;padding-top:22px;display:flex;justify-content:flex-end;gap:10px}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:24px}.search{flex:1;position:relative}.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}.search .input{padding-left:40px}.sort{min-height:44px;border:1px solid #c8bfae;border-radius:9px;padding:0 12px;background:var(--card);font-size:12px;font-weight:600}.list{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;position:relative;overflow:hidden;animation:rise .35s both}.card:hover{border-color:var(--soft);box-shadow:0 8px 24px #2736380f}.card.alarm{border-color:var(--coral);background:#fcf0e8}.card.alarm:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--coral);animation:pulse 1.3s infinite}.card-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.star{border:0;background:transparent;color:#a99f90;width:30px;height:30px;padding:0;display:grid;place-items:center;border-radius:7px}.star:hover,.star.favorite{color:#e2ae28;background:#e2ae2817}.name{margin:0;font-size:17px;letter-spacing:-.035em;font-weight:600;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;background:var(--soft)}.badge.teal{color:var(--teal);background:#39858d1a}.badge.coral{color:var(--coral);background:#d86d4a20}.desc{color:var(--muted);font-size:13px;line-height:1.45;margin:10px 0 14px;max-width:580px}.card-date{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.card-actions{display:flex;gap:5px;justify-content:flex-end;margin-top:16px}.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:7px;width:34px;height:34px;display:grid;place-items:center}.icon:hover{background:var(--soft);color:var(--ink)}.timebox{text-align:right;min-width:190px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}.remaining{font-size:clamp(19px,2.3vw,27px);letter-spacing:-.06em}.alarm .remaining{color:var(--coral);animation:flash 1.15s infinite}.target{color:var(--muted);font-size:11px;margin-top:6px}.alarm-display{margin-top:10px;border:1px solid #d86d4a39;border-radius:10px;padding:9px 11px;color:var(--coral);font-size:11px;display:flex;gap:7px;align-items:center}.bell-face{width:21px;height:16px;border:2px solid var(--coral);border-radius:10px 10px 4px 4px;position:relative}.bell-face:before{content:"";position:absolute;bottom:-6px;left:7px;width:5px;height:3px;background:var(--coral);border-radius:4px}.alarm-actions{display:flex;gap:8px;margin-top:13px}.alarm-actions .primary,.alarm-actions .danger{min-height:34px;font-size:11px}.alarm-actions .danger{border:1px solid #ad393131}.list-empty{text-align:center;border:1px dashed var(--line);border-radius:18px;padding:61px 25px;background:#fcf9f16f}.empty-orbit{height:69px;width:69px;border:1px solid var(--soft);border-radius:50%;margin:0 auto 21px;display:grid;place-items:center;color:var(--teal);font-size:28px}.empty-orbit:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--coral);transform:translate(29px,-28px)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.35}}@keyframes flash{50%{opacity:.45}}

@media(max-width:900px){.sidebar{width:218px}.main{margin-left:218px}.wrap{width:min(100% - 44px,760px)}.hero-grid{grid-template-columns:1fr}.clock{min-height:260px}}

@media(max-width:700px){.sidebar{display:none}.main{margin-left:0}.mobile{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:#f3efe5e8;position:sticky;top:0;z-index:5}.mobile .brand{margin:0}.mobile-nav{display:flex;gap:4px}.mobile-nav button{width:37px;height:37px;padding:0;border:0;background:transparent;color:var(--muted);border-radius:8px}.mobile-nav button.active{background:var(--soft);color:var(--ink)}.wrap{width:calc(100% - 32px);padding-top:33px}.topline{align-items:flex-start;flex-direction:column;margin-bottom:29px}.topline>.primary{width:100%}.hero{padding:27px 24px;min-height:390px}.clock{padding:24px}.form-grid{grid-template-columns:1fr;gap:18px}.field.full{grid-column:auto}.form-actions{flex-direction:column-reverse}.form-actions>*{width:100%}.toolbar{align-items:stretch;flex-direction:column}.sort{width:100%}.card{grid-template-columns:1fr;gap:10px}.timebox{align-items:flex-start;text-align:left;min-width:0}.card-actions{justify-content:flex-start}.alarm-actions{flex-wrap:wrap}.clock-reading{font-size:clamp(27px,9vw,42px)}}

</style>

</head>

<body>

<div id="app"></div>

<script>

(() => {

const KEY = "geri-sayim-countdowns-single";
const AUDIO_DB = "geri-sayim-audio-single";
const STORE = "files";
const app = document.getElementById("app");
let page = "home", search = "", sort = "time", now = Date.now();
let items = [], ready = false;
const playing = new Map(), contexts = new Map();

const rules = [[/toplant|meeting/i,"Toplantı"],[/s[ıi]nav|exam/i,"Sınav"],[/do[gğ]um|birthday/i,"Doğum günü"],[/tatil|holiday/i,"Tatil"],[/proje|project/i,"Proje"],[/ödem|odem|payment/i,"Ödeme"],[/etkinlik|event/i,"Etkinlik"]];

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));

const cat = value => (rules.find(([r]) => r.test(value)) || [,""])[1];

const pad = (n, size=2) => String(n).padStart(size,"0");

const localDate = d => { const x = new Date(d.getTime() - d.getTimezoneOffset()*60000); return x.toISOString().slice(0,10); };

const localTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

const targetText = value => new Intl.DateTimeFormat("tr-TR",{weekday:"short",day:"2-digit",month:"long",hour:"2-digit",minute:"2-digit"}).format(new Date(value));

const remain = ms => { const s=Math.max(0,ms),days=Math.floor(s/86400000),h=Math.floor(s%86400000/3600000),m=Math.floor(s%3600000/60000),sec=Math.floor(s%60000/1000); return `${days?days+"g ":""}${pad(h)}:${pad(m)}:${pad(sec)}.${pad(Math.floor(s%1000),3)}`; };

const compact = list => list.map(({musicDataUrl,...item}) => item);

function persist(list){ items=list; try{localStorage.setItem(KEY,JSON.stringify(compact(list)))}catch{try{localStorage.removeItem(KEY);localStorage.setItem(KEY,JSON.stringify(compact(list)))}catch{}} render(); }

function db(){ return new Promise(resolve=>{ if(!("indexedDB" in window)) return resolve(null); const r=indexedDB.open(AUDIO_DB,1); r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)}; r.onsuccess=()=>resolve(r.result); r.onerror=()=>resolve(null); });}

async function saveAudio(id,data){ if(!data)return; const d=await db(); if(!d)return; const t=d.transaction(STORE,"readwrite");t.objectStore(STORE).put(data,id);t.oncomplete=()=>d.close(); }

async function getAudio(id){ const d=await db(); if(!d)return ""; return new Promise(resolve=>{const r=d.transaction(STORE,"readonly").objectStore(STORE).get(id);r.onsuccess=()=>{d.close();resolve(typeof r.result==="string"?r.result:"")};r.onerror=()=>{d.close();resolve("")}}); }

async function deleteAudio(id){const d=await db();if(!d)return;const t=d.transaction(STORE,"readwrite");t.objectStore(STORE).delete(id);t.oncomplete=()=>d.close()}

function stopSound(id){ const a=playing.get(id); if(a){a.pause();a.currentTime=0;a.removeAttribute("src");a.load();playing.delete(id)} const c=contexts.get(id);if(c){c.close();contexts.delete(id)} }

function fallback(id){ try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();contexts.set(id,c);o.type="square";o.frequency.value=740;g.gain.value=.0001;o.connect(g);g.connect(c.destination);o.start(); const beat=()=>{if(!contexts.has(id))return;const t=c.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25)};beat();const interval=setInterval(beat,650);c.onstatechange=()=>{if(c.state==="closed")clearInterval(interval)}}catch{}}

function play(item){ if(item.musicDataUrl){const a=new Audio(item.musicDataUrl);a.loop=true;playing.set(item.id,a);a.play().catch(()=>{playing.delete(item.id);fallback(item.id)})}else fallback(item.id) }

function checkDue(){ if(!ready)return;const due=items.filter(x=>!x.completed&&new Date(x.targetAt).getTime()<=now);if(!due.length)return;const next=items.map(x=>due.some(d=>d.id===x.id)?{...x,completed:true}:x);persist(next);due.forEach(x=>{if(!x.alarmed){x.alarmed=true;play(x)}}); }

async function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||"[]");items=saved.map(x=>({...x,musicDataUrl:"",alarmed:false}));ready=true;render();const audio=await Promise.all(items.map(async x=>[x.id,await getAudio(x.id)]));const map=new Map(audio);items=items.map(x=>({...x,musicDataUrl:map.get(x.id)||""}));render()}catch{ready=true;render()}}

function nav(next){page=next;search="";render();scrollTo(0,0)}

function layout(content){const count=items.length;return `<div class="app"><aside class="sidebar"><a class="brand" href="#" data-nav="home"><span class="mark"></span><span class="brand-name">geri<span>sayım</span></span></a><p class="nav-label">Kontrol masası</p><nav class="nav"><button class="${page==="home"?"active":""}" data-nav="home">⌂ <span>Ana Sayfa</span></button><button class="${page==="countdowns"?"active":""}" data-nav="countdowns">☷ <span>Geri Sayımlar</span>${count?`<small style="margin-left:auto;opacity:.55">${count}</small>`:""}</button></nav><div class="side-note"><strong>Zaman burada görünür.</strong>Önemli anlarını tek bir yerde tut. Verilerin yalnızca bu tarayıcıda saklanır.</div></aside><header class="mobile"><a class="brand" href="#" data-nav="home"><span class="mark"></span><span class="brand-name">geri<span>sayım</span></span></a><nav class="mobile-nav"><button class="${page==="home"?"active":""}" data-nav="home" aria-label="Ana Sayfa">⌂</button><button class="${page==="countdowns"?"active":""}" data-nav="countdowns" aria-label="Geri Sayımlar">☷</button></nav></header><main class="main">${content}</main></div>`}

function liveClock(){const d=new Date(now),time=`${pad(d.getHours())}:${pad(d.getMinutes())}`,ms=pad(d.getMilliseconds(),3);return `<section class="clock"><div class="clock-top"><span class="eyebrow">Şu an</span><span style="color:var(--teal);font-size:20px">◷</span></div><div><div class="clock-reading">${time}<span class="clock-seconds">:${pad(d.getSeconds())}</span><span class="clock-ms">.${ms}</span></div><div class="clock-date">${new Intl.DateTimeFormat("tr-TR",{weekday:"long",day:"numeric",month:"long"}).format(d)}</div></div><div><div class="rule"></div><div class="clock-foot"><span><i class="dot"></i>Yerel saat</span><span>Milisaniye hassasiyeti</span></div></div></section>`}

function home(){const active=items.filter(x=>!x.completed).sort((a,b)=>new Date(a.targetAt)-new Date(b.targetAt));return layout(`<div class="wrap"><div class="topline"><div><div class="eyebrow">Kişisel zaman istasyonu</div><h1>Önündeki zamana<br>yer aç.</h1><p class="subtitle">Önemli anlar yaklaşırken onları görünür, sakin ve tam zamanında tut.</p></div><button class="primary" data-nav="create">＋ Geri Sayım Oluştur</button></div><div class="hero-grid"><section class="hero"><div class="eyebrow">Bugünün ritmi</div><h2>Bir sonraki<br>önemli anın<br>ne zaman?</h2><p>Küçük bir sayaç, büyük bir fark yaratır. Bir tarih seç; kalan zamanı burada birlikte izleyelim.</p><div class="actions"><button class="primary" data-nav="create">Yeni bir an ekle ›</button><button class="secondary" data-nav="countdowns">Güncel Geri Sayımlar</button></div></section>${liveClock()}</div><div class="section-head"><h2>Yaklaşan anlar</h2><button data-nav="countdowns">Tümünü gör ›</button></div>${active.length?`<div class="mini-list">${active.slice(0,3).map(x=>`<div class="mini"><div><div class="mini-title">${esc(x.name)}</div><div class="meta">${targetText(x.targetAt)}</div></div><div class="mini-time">${remain(new Date(x.targetAt)-now)}</div></div>`).join("")}</div>`:`<div class="empty-mini">Henüz yaklaşan bir an yok. İlk geri sayımını kurmak için yukarıdaki düğmeyi kullan.</div>`}</div>`)}

function create(){const initial=new Date(Date.now()+60000);return layout(`<div class="wrap form-wrap"><div class="topline"><div><button class="quiet" data-nav="home">‹ Ana sayfa</button><div class="eyebrow" style="margin-top:27px">Yeni zaman noktası</div><h1>Bir anı<br>işaretle.</h1><p class="subtitle">Detayları ekle; zamanı geldiğinde seni burada karşılayalım.</p></div></div><form class="form-card" id="create-form"><div class="form-grid"><label class="field full"><span class="label">Geri Sayım İsmi</span><input class="input" id="name" required maxlength="90" autofocus placeholder="Örn. Sunum, tatil, yeni başlangıç"></label><label class="field full"><span class="label">Açıklaması <span class="hint">(isteğe bağlı)</span></span><textarea class="textarea" id="description" maxlength="280" placeholder="Bu an neden önemli?"></textarea></label><label class="field full"><span class="label">Müzik Sesi Seç <span class="hint">(isteğe bağlı)</span></span><input class="file" id="music" type="file" accept="audio/*"><span class="hint" id="file-label">Dosya seçilmezse klasik alarm sesi kullanılır.</span></label><label class="field"><span class="label">Geri Sayım Tarihi</span><input class="input" id="date" type="date" min="${localDate(new Date())}" value="${localDate(initial)}" required></label><label class="field"><span class="label">Geri Sayım Saati</span><input class="input" id="time" type="time" step="1" value="${localTime(initial)}" required><span class="hint">Başlangıç saati şu andan bir dakika sonrasıdır.</span></label></div><div class="error" id="form-error"></div><div class="form-actions"><button type="button" class="secondary" data-nav="home">Vazgeç</button><button class="primary" type="submit">◷ Geri Sayım Oluştur</button></div></form></div>`)}

function card(x){const alarm=x.completed&&!x.alarmDismissed;const hint=cat(`${x.name} ${x.description}`);return `<article class="card ${alarm?"alarm":""}" data-id="${x.id}"><div><div class="card-top"><button class="star ${x.isFavorite?"favorite":""}" data-action="favorite" aria-label="Favorilere ekle" title="Favorilere ekle">${x.isFavorite?"★":"☆"}</button><h3 class="name">${esc(x.name)}</h3>${hint?`<span class="badge">${esc(hint)}</span>`:""}${x.musicName?`<span class="badge teal">♫ Müzik</span>`:""}${x.completed?`<span class="badge coral">${alarm?"Alarm":"Tamamlandı"}</span>`:""}</div>${x.description?`<p class="desc">${esc(x.description)}</p>`:""}<div class="card-date">▣ ${targetText(x.targetAt)}</div><div class="card-actions"><button class="icon" data-action="delete" title="Sil">⌫</button></div></div><div class="timebox"><div class="remaining">${remain(new Date(x.targetAt)-now)}</div><div class="target">${alarm?"Zamanı geldi":x.completed?"Alarm susturuldu":"kalan süre"}</div>${alarm?`<div class="alarm-display">${x.musicName?`<span style="font:11px ui-monospace">00:00:00.000</span>`:`<span class="bell-face"></span><span>Klasik alarm</span>`}</div><div class="alarm-actions"><button class="primary" data-action="mute">Sustur</button><button class="danger" data-action="delete">Sil</button></div>`:""}</div></article>`}

function countdowns(){let list=items.filter(x=>{const q=search.trim().toLocaleLowerCase("tr-TR");return !q||`${x.name} ${x.description}`.toLocaleLowerCase("tr-TR").includes(q)});list.sort((a,b)=>sort==="favorite"?Number(b.isFavorite)-Number(a.isFavorite)||new Date(a.targetAt)-new Date(b.targetAt):new Date(a.targetAt)-new Date(b.targetAt));return layout(`<div class="wrap"><div class="topline"><div><div class="eyebrow">Zaman çizelgen</div><h1>Güncel Geri<br>Sayım<span style="color:var(--coral)">lar.</span></h1><p class="subtitle">${items.filter(x=>!x.completed).length?items.filter(x=>!x.completed).length+" yaklaşan anın var."+"":"Yaklaşan anların burada görünecek."} Aramak, sıralamak ve yeniden ziyaret etmek için tek bir masa.</p></div><button class="primary" data-nav="create">＋ Geri Sayım Oluştur</button></div><div class="toolbar"><div class="search"><span style="position:absolute;left:13px;top:11px;color:var(--muted)">⌕</span><input class="input" id="search" type="search" value="${esc(search)}" placeholder="Başlık veya açıklamada ara..."></div><select class="sort" id="sort"><option value="time" ${sort==="time"?"selected":""}>Vakte Göre (Azalan)</option><option value="favorite" ${sort==="favorite"?"selected":""}>Favoriler</option></select></div>${list.length?`<div class="list">${list.map(card).join("")}</div>`:`<div class="list-empty"><div class="empty-orbit">◷</div><h3>${search.trim()?"Bu arama sessiz kaldı.":"İlk anını burada başlat."}</h3><p>${search.trim()?"Başlık veya açıklamada başka kelimeler dene. Kategorileri de otomatik olarak yakalarız.":"Önemli bir tarih seç, gerisini geri sayıma bırak. Tüm kayıtların bu tarayıcıda güvende."}</p>${search.trim()?"":`<button class="primary" data-nav="create">＋ Geri Sayım Oluştur</button>`}</div>`}</div>`)}

function render(){app.innerHTML=page==="home"?home():page==="create"?create():countdowns();bind()}

function bind(){document.querySelectorAll("[data-nav]").forEach(e=>e.onclick=a=>{a.preventDefault();nav(e.dataset.nav)});const form=document.getElementById("create-form");if(form){const file=document.getElementById("music");file.onchange=()=>{document.getElementById("file-label").textContent=file.files[0]?`Seçildi: ${file.files[0].name}`:"Dosya seçilmezse klasik alarm sesi kullanılır."};form.onsubmit=async e=>{e.preventDefault();const name=document.getElementById("name").value.trim(),date=document.getElementById("date").value,time=document.getElementById("time").value,target=new Date(`${date}T${time}`);const error=document.getElementById("form-error");if(!name){error.textContent="Geri sayımına bir isim vermelisin.";return}if(!date||!time||isNaN(target)||target<=new Date()){error.textContent="Geri sayım tarihi ve saati gelecekte olmalı.";return}const f=file.files[0],id=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();const item={id,name,description:document.getElementById("description").value.trim(),targetAt:target.toISOString(),isFavorite:false,musicName:f?f.name:"",musicDataUrl:"",completed:false,alarmDismissed:false,alarmed:false};if(f){const r=new FileReader();r.onload=async()=>{item.musicDataUrl=typeof r.result==="string"?r.result:"";await saveAudio(id,item.musicDataUrl);persist([item,...items]);nav("countdowns")};r.readAsDataURL(f)}else{persist([item,...items]);nav("countdowns")}}}const input=document.getElementById("search");if(input){input.oninput=()=>{search=input.value;render();const n=document.getElementById("search");n.focus();n.setSelectionRange(search.length,search.length)};document.getElementById("sort").onchange=e=>{sort=e.target.value;render()}}document.querySelectorAll("[data-action]").forEach(e=>e.onclick=async()=>{const id=e.closest("[data-id]").dataset.id,x=items.find(i=>i.id===id);if(!x)return;if(e.dataset.action==="favorite"){persist(items.map(i=>i.id===id?{...i,isFavorite:!i.isFavorite}:i))}if(e.dataset.action==="mute"){stopSound(id);persist(items.map(i=>i.id===id?{...i,alarmDismissed:true}:i))}if(e.dataset.action==="delete"&&confirm("Bu geri sayımı silmek istediğine emin misin?")){stopSound(id);await deleteAudio(id);persist(items.filter(i=>i.id!==id))}})}

load();

setInterval(()=>{now=Date.now();checkDue();if(page==="home"){render()}else if(page==="countdowns"){document.querySelectorAll(".card").forEach(card=>{const item=items.find(x=>x.id===card.dataset.id);const reading=card.querySelector(".remaining");if(item&&reading)reading.textContent=remain(new Date(item.targetAt)-now)})}},47);

window.addEventListener("beforeunload",()=>{playing.forEach((_,id)=>stopSound(id));contexts.forEach(c=>c.close())});
