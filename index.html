<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geri Sayım</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#193541">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f0e7;
            color: #193541;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #d86d4a;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Geri Sayım Uygulaması</h1>
        <p>Alarm kurulabilen birden fazla geri sayımı yakın vakitten uzak vakte inceleyebileceğiniz ekrandasınız.</p>
        <div id="countdown-list"></div>
    </div>

    <script>
        // PWA Service Worker Kaydı
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('Service Worker başarıyla yüklendi!'))
            .catch((err) => console.log('Service Worker yüklenemedi:', err));
        }
    </script>
</body>
</html>
